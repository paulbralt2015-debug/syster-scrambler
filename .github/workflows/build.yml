name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: python tests/test_scrambler.py
      - run: pyinstaller --onefile --windowed --collect-all imageio_ffmpeg --collect-all sounddevice --name syster-videocrypt-player player.py
      - uses: actions/upload-artifact@v4
        with:
          name: syster-videocrypt-player-windows
          path: dist/syster-videocrypt-player.exe
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/syster-videocrypt-player.exe
